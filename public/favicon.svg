<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Potiguar Golden Yellow Gradient -->
    <linearGradient id="potiguarYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE033" />
      <stop offset="50%" stop-color="#FFCC00" />
      <stop offset="100%" stop-color="#F5B300" />
    </linearGradient>

    <!-- Potiguar Royal Blue Gradient -->
    <linearGradient id="potiguarBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0044CC" />
      <stop offset="60%" stop-color="#003399" />
      <stop offset="100%" stop-color="#002266" />
    </linearGradient>

    <!-- Soft drop shadow for depth -->
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Outer Iconic Oval Badge matching the site's .logo-oval -->
  <ellipse cx="256" cy="256" rx="234" ry="182" 
           fill="url(#potiguarYellow)" 
           stroke="url(#potiguarBlue)" 
           stroke-width="32" 
           filter="url(#badgeShadow)" />

  <!-- Subtle inner highlight ring -->
  <ellipse cx="256" cy="256" rx="208" ry="156" 
           fill="none" 
           stroke="#FFFFFF" 
           stroke-width="6" 
           stroke-opacity="0.45" />

  <!-- Stylized Automotive Monogram 'P' (Bold, Dynamic, Forward Slant) -->
  <g id="monogram" transform="translate(150, 115)">
    <!-- Main 'P' silhouette in Royal Blue -->
    <path d="M 45,10 
             L 142,10 
             C 198,10 234,38 234,88 
             C 234,138 198,166 142,166 
             L 100,166 
             L 100,272 
             L 45,272 
             Z" 
          fill="url(#potiguarBlue)" />

    <!-- Inner 'P' cutout in Potiguar Yellow -->
    <path d="M 100,56 
             L 136,56 
             C 166,56 182,70 182,88 
             C 182,106 166,120 136,120 
             L 100,120 
             Z" 
          fill="url(#potiguarYellow)" />

    <!-- Speed / tire groove cuts in the spine for automotive identity -->
    <rect x="25" y="60" width="30" height="15" rx="5" fill="url(#potiguarYellow)" />
    <rect x="25" y="102" width="30" height="15" rx="5" fill="url(#potiguarYellow)" />
    <rect x="25" y="144" width="30" height="15" rx="5" fill="url(#potiguarYellow)" />
    <rect x="25" y="186" width="30" height="15" rx="5" fill="url(#potiguarYellow)" />
  </g>
</svg>